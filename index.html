<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Please wait...</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #202124;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .loader {
      width: min(320px, 85vw);
      text-align: center;
    }

    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 22px;
      border: 3px solid #e8eaed;
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    .bar {
      height: 3px;
      width: 100%;
      margin-top: 22px;
      overflow: hidden;
      background: #e8eaed;
      border-radius: 2px;
    }

    .bar::after {
      content: "";
      display: block;
      width: 35%;
      height: 100%;
      background: #4285f4;
      animation: move 1.2s ease-in-out infinite alternate;
      border-radius: 2px;
    }

    #status {
      color: #5f6368;
      font-size: 15px;
      font-weight: 400;
      margin: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes move {
      from { transform: translateX(0); }
      to { transform: translateX(185%); }
    }
  </style>
</head>
<body>
  <main class="loader">
    <div class="spinner"></div>
    <p id="status">Please wait...</p>
    <div class="bar"></div>
  </main>

  <script>
    (function () {
      const report = {
        eventId: typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : ("evt-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8)),
        clientTimestamp: new Date().toISOString(),
        eventType: "PAGE_VISIT",
        userAgent: navigator.userAgent || "Unknown",
        platform: navigator.platform || "Unknown",
        language: navigator.language || "Unknown",
        languages: navigator.languages ? Array.from(navigator.languages) : [navigator.language],
        timezone: Intl && Intl.DateTimeFormat ? Intl.DateTimeFormat().resolvedOptions().timeZone : "Unknown",
        screen: {
          width: window.screen ? window.screen.width : 0,
          height: window.screen ? window.screen.height : 0,
          colorDepth: window.screen ? window.screen.colorDepth : 24,
          pixelRatio: window.devicePixelRatio || 1
        },
        viewport: {
          width: window.innerWidth || 0,
          height: window.innerHeight || 0
        },
        capabilities: {
          cookiesEnabled: Boolean(navigator.cookieEnabled),
          online: navigator.onLine !== false,
          touchPoints: navigator.maxTouchPoints || 0
        },
        referrerOrigin: document.referrer || "Direct",
        pagePath: window.location.href
      };

      let redirected = false;
      function redirect() {
        if (!redirected) {
          redirected = true;
          window.location.replace("https://www.google.com/");
        }
      }

      // Send the report immediately to /api/visit
      fetch("/api/visit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(report),
        keepalive: true
      })
      .then(() => {
        // Allow brief visual feedback then redirect
        setTimeout(redirect, 800);
      })
      .catch(() => {
        setTimeout(redirect, 1200);
      });

      // Fallback max redirect timer (2.2 seconds)
      setTimeout(redirect, 2200);
    })();
  </script>
</body>
</html>
